    <text x="72" y="212" font-size="80" font-weight="700" fill="#f1f5f9">Road damage</text>
    <text x="72" y="298" font-size="80" font-weight="700" fill="#f1f5f9">detection</text>
    <text x="72" y="352" font-size="24" fill="#b6c2cf">Cracks and potholes in photos and video.</text>
    <text x="72" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#b6c2cf">deteccion-fallas-viales · MIT · Python 3.12</text>
