<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Road damage detection</title>
  <desc id="hero-desc">Cover of deteccion-fallas-viales. On the left, the project name and its value. On the right, an illustrative road surface with four damage types marked with the model's class codes: D00 longitudinal crack, D10 transverse crack, D20 alligator crack and D40 pothole.</desc>

